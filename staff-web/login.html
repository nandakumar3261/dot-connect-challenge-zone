<!DOCTYPE html>
<html lang="en" data-default-theme="dark">
<head>
<script>(function(){try{var t=localStorage.getItem('dcz_theme')||document.documentElement.getAttribute('data-default-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoTT Connect — Staff Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="style.css">
</head>
<body class="signin-page">
  <button id="themeToggle" class="theme-toggle theme-toggle-fixed" title="Toggle light / dark" aria-label="Toggle light or dark mode">🌙</button>
  <main class="signin-wrap">
    <form id="loginForm" class="signin-card">
      <div class="signin-logo">
        <img src="assets/logo-icon.png" alt="DoTT Connect" class="brand-icon-md">
      </div>
      <h1>DoTT Connect 2026</h1>
      <p class="muted">Admin Portal Authentication</p>

      <label for="username">Username</label>
      <div class="field-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input id="username" type="text" placeholder="Enter admin ID" autocomplete="username" required>
      </div>

      <label for="password">Password</label>
      <div class="field-icon">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 10V7a4 4 0 118 0v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-arrow">
        Sign In
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p id="loginError" class="form-error"></p>

      <div class="signin-foot">
        <a href="#" onclick="return false;">Forgot Credentials?</a>
        <span class="secure-badge">🔒 SECURE V2.4</span>
      </div>
    </form>
    <p class="signin-copyright">© 2026 DoTT Connect. Authorized access only.</p>
  </main>
  <script src="theme.js"></script>
  <script src="staff.js"></script>
</body>
</html>
