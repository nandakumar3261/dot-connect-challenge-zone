<!DOCTYPE html>
<html lang="en" data-default-theme="dark">
<head>
<script>(function(){try{var t=localStorage.getItem('dcz_theme')||document.documentElement.getAttribute('data-default-theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoTT Connect 2026 — Challenge Zone Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <img src="assets/logo-icon.png" alt="DoTT Connect" class="brand-icon" aria-hidden="true">
      <span class="brand-text">
        <span class="brand-name">DoTT&nbsp;Connect <b>2026</b></span>
        <span class="brand-sub">Challenge Zone · Sept 2–11, 2026</span>
      </span>
    </div>
    <div class="topbar-right">
      <a href="register.html" class="btn btn-primary">Register</a>
      <button id="themeToggle" class="theme-toggle" title="Toggle light / dark" aria-label="Toggle light or dark mode">🌙</button>
      <div class="live" id="liveClock">
        <span class="live-dot"></span><span id="clock">—</span>
      </div>
    </div>
  </header>

  <div class="toolbar-row">
    <div class="toolbar-stack">
      <nav class="tabs" id="tabs" aria-label="Challenge selector">
        <!-- tabs injected from /api/config; "All Challenges" is first & default -->
      </nav>

      <div class="board-toolbar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="boardSearch" type="text" placeholder="Search by name, roll number, or DoTT ID…" autocomplete="off">
          <button id="boardSearchBtn" type="button">Search</button>
        </div>
        <p class="search-empty" id="searchEmpty" hidden></p>
      </div>
    </div>

    <div class="toolbar-qr" id="topbarQr">
      <img id="qrHeaderImg" class="qr-img-corner" alt="Scan to open this leaderboard on your phone">
    </div>
  </div>

  <main class="board" id="board">
    <!-- content injected by leaderboard.js -->
    <p class="loading">Loading leaderboard…</p>
  </main>

  <footer class="foot">
    <p>Final winners for each challenge are announced after the event period — leading today doesn't declare a winner. Contact details are never shown here.</p>
  </footer>

  <script src="theme.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
